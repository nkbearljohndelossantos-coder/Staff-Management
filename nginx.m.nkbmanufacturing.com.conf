# ==============================================================================
# NKB MANUFACTURING -- HOST NGINX VIRTUAL HOST CONFIGURATION
# File Location on VPS: /etc/nginx/conf.d/m.nkbmanufacturing.com.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name m.nkbmanufacturing.com;

    client_max_body_size 50M;

    # Frontend Application (Isolated Docker container on 127.0.0.1:39101)
    location / {
        proxy_pass http://127.0.0.1:39101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend REST API (Isolated Docker container on 127.0.0.1:39102)
    location /api {
        proxy_pass http://127.0.0.1:39102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
